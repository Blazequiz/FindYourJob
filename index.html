<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./public/favicon-findyourjob.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FindYourJob</title>
    <link rel="stylesheet" href="./css/main.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/1.1.0/modern-normalize.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="container header-wrapper">
        <img src="./image/logo.svg" alt="logo" />
        <svg width="24" height="16" class="svg-item">
          <use
            href="./img/symbol-defs.svg#icon-burger-menu"
            class="burger-menu-svg"
          ></use>
        </svg>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="container">
          <h1>Найдите удаленную работу вашей мечты</h1>
          <p class="hero-paragraph">
            Создайте резюме или отправьте отклик на вакансию в компании с
            мировым именем и работайте по свободному графику
          </p>
          <div class="form-wrapper">
            <form action="find_form" class="form">
              <label class="lform-label-searching">
                <input type="email" class="form-input-searching" placeholder="Начните поиск">
              </label>
              <button class="form-button" type="submit">
                <svg width="15" height="15" class="btn-icon-loop" style="fill: white;">
                  <use
                    href="./img/symbol-defs.svg#icon-loop"
                  ></use>
                </svg>
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
